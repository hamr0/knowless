name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (JSDoc consistency)
        run: npm run typecheck
      - name: Build types (proves .d.ts emit cleanly from JSDoc)
        run: npm run build:types
      - name: Test
        run: npm test
